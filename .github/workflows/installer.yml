# Builds AnnotateSetup.exe. Pull requests that touch the installer get a build to download from
# the run. Pushing a tag such as v0.1.0 also makes a draft release with the exe attached, which
# stays unpublished until someone publishes it by hand.
name: Installer

on:
  pull_request:
    paths: ['installer/**', 'package.json', '.github/workflows/installer.yml']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build AnnotateSetup.exe
        shell: pwsh
        run: ./installer/build.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: AnnotateSetup
          path: installer/dist/AnnotateSetup.exe
      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" installer/dist/AnnotateSetup.exe --draft
          --title "Annotate ${{ github.ref_name }}"
          --notes "Download AnnotateSetup.exe and run it. Windows only. The exe is not code-signed yet, so Windows SmartScreen warns first: choose More info, then Run anyway."
